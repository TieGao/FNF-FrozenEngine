name: Cache Build

# build.yml 的带缓存版：步骤与 build.yml 同构，只在「装依赖 / 编译」前后套一层缓存。
#
# 缓存思路借自 CodenameEngine（windows.yml / linux.yml / macos.yml）：把「依赖目录 +
# 编译产物」一起存。CNE 那份没真正生效（见下），这里是落成能命中的版本。
#
# 为什么拆成两个文件：release 那条链（main-release.yml 等）调的是 build.yml —— 出
# release 时宁可全量重编，也不想让缓存变成发布产物的一个变量。带缓存的构建只给
# desktop-build.yml / mobile-build.yml 用。
#
# ── 缓存怎么才真正命中（对齐 CNE 的「依赖 + 编译产物」）──
#  1) 依赖目录：钉到仓库内 .haxelib/（与 CNE 完全一致）。相对路径跨 OS 唯一，缓存里
#     只需一条 path，也绕开"去猜 Windows 全局 haxelib 路径"。
#  2) 编译产物：走 HXCPP_COMPILE_CACHE 内容寻址的 .hxcpp_cache —— 这才是真正跳过编译
#     的那份。CNE 想缓存的是 export/*/obj/，但那条路在 CI 上结构上不可能命中：
#     obj 靠 mtime 比新旧（File.isOutOfDate），checkout 完源文件 mtime 永远是"刚刚"，
#     缓存里的 obj 怎么比都是旧的。CNE 也因此把相关步骤整块注释掉了。
# 清理入口在 hxcpp-cache.yml。

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      # 依赖策略（参考 NovaFlare 的 dependencies_to_update，语义按本仓的固定依赖清单收敛成两态）：
      #   留空  → 直接用 restore 回来的 .haxelib/，跳过整个依赖安装步骤（不联网，最快）
      #   非空  → 跑 setup 清单，重新校验 / 拉取全部依赖（等价于改动前的默认行为）
      #           同时**跳过恢复缓存**、成功后清掉被取代的旧缓存 —— 这就是"依赖炸了重来一遍"的开关。
      #           依赖装挂了（缺库、Type not found）时填 all 重跑一次即可。
      # 本仓的 setup 是写死的 pinned 清单（不是 hmm.json），所以没有 NF 那种"只更新某几个库"的粒度。
      dependencies_to_update:
        required: false
        type: string
        default: ''

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: FrozenEngine
  CACHE_PREFIX: fe-hxcpp

  # 依赖目录钉到仓库内 .haxelib/（与 CNE 一致）。setup/unix.sh 见到 HAXELIB_REPO 就不
  # 再 setup 到 ~/haxelib 覆盖它；setup/windows.bat 本就不 setup，无需改。本地开发不设
  # 这个变量，行为不变。
  HAXELIB_REPO: ${{ github.workspace }}/.haxelib

  # 设了 HXCPP_COMPILE_CACHE，hxcpp 才会用内容 hash 给 .obj 命名，跨机器命中就直接
  # 跳过编译。只靠 mtime 那条路在 CI 上必然失效 —— checkout 完源文件 mtime 永远是
  # "刚刚"，缓存里的 .obj 怎么比都是旧的。
  #
  # 只走环境变量这一条通道，别再用 -D 传一遍。
  # hxcpp 的 BuildTool.runMain() 开头就把 Sys.environment() 整个灌进 defines，环境变量
  # 本身就够；-D 那条在 Windows 上会被上游拼坏：hxcpp 收到的值成了 "<路径>=<路径>"、
  # 反斜杠还翻了一倍，CompileCache.init() 拿它建目录直接失败，缓存静默失效。
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

# Prune superseded caches 那步要用 GITHUB_TOKEN 删缓存
permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      # 把 haxelib 仓库钉到项目内 .haxelib/，让依赖目录跨 OS 落到同一个相对路径。
      # 放在 Restore 之前：先建目录，再让缓存往里灌。这一步每轮都得跑 —— 指向仓库的
      # 配置文件在用户家目录，不在缓存里。
      - name: Configure project-local haxelib repo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.haxelib" | Out-Null
          haxelib setup "$env:GITHUB_WORKSPACE\.haxelib"

      - name: Configure project-local haxelib repo (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.haxelib"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      # key 是滚动的：restore 用前缀匹配拿上一轮那份，save 用 run_id 开新的一份。
      # 不用固定 key 是因为 cache 写进去不可覆盖，固定 key 一次之后就再也长不大了，
      # 新编译出来的 .obj 进不去。堆积的旧份由 hxcpp-cache.yml 的 prune 收敛。
      #
      # key 里必须带上 target：同一个 runner 上会并行跑好几个 target，光靠 os+arch
      # 区分不开，它们会抢同一个 key —— 只有一个 save 得进去，其余的全白编。
      # restore 也只认自己那条线：不同 target 的编译参数不同，算出来的 hash 就不同，
      # 拿别人的缓存没用。
      - name: Compute cache target
        id: cache_target
        shell: bash
        run: echo "slug=$(echo '${{ inputs.name }}' | tr ' A-Z' '-a-z')" >> $GITHUB_OUTPUT

      # 依赖 + 编译产物一把 key 一起缓存（与 CNE 的缓存内容对齐）。每 OS 一把 key、
      # 不跨 OS，所以不需要 enableCrossOsArchive。
      # 翻新库（dependencies_to_update 非空）时整份跳过：依赖与 .obj 缓存全部
      # 重来，不让旧 hxcpp / 旧依赖编出的产物有被读回的机会。
      - name: Restore build cache (deps + hxcpp objects)
        if: inputs.dependencies_to_update == ''
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_target.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_target.outputs.slug }}-
          path: |
            .haxelib/
            .hxcpp_cache

      # PCH（预编译头）不做跨轮缓存：它把 NDK/SDK sysroot 文件的 mtime 编进去，
      # 换一个 runner（文件系统重新铺过、mtime 变了）clang 直接拒收缓存的 pch
      # —— "file ... has been modified since the precompiled header was built"。
      # restore 后把只装 pch 的 haxe/ 子目录删掉，每轮现编（秒级），.obj 那份
      # 内容寻址缓存不受影响。
      - name: Drop stale PCH from restored hxcpp cache
        if: inputs.dependencies_to_update == ''
        shell: bash
        run: rm -rf .hxcpp_cache/haxe

      # 依赖策略判定必须放在 Restore 之后 —— 判断依据就是 restore 的产物。
      # 留空且缓存可用 → cached：跳过安装。
      # 留空但缓存是冷的（或明显残缺）→ install：回退到完整安装，别让构建裸奔。
      # 显式传了值 → install：重新校验 / 拉取全部依赖。
      #
      # 哨兵不能只看目录在不在：缓存 save 是 if: always() 的，失败轮会把"装了一半"的库
      # 一起存进去 —— luahscript 就出现过只剩一个空目录，之后每轮都命中这份坏缓存，
      # 编译期直接 `Type not found : luahscript.LuaParser`。这里改成让 haxelib 自己报
      # classpath，再核那个目录真实存在，任一个缺失就老实重装。
      - name: Resolve haxelib strategy
        id: haxelib
        shell: bash
        run: |
          want='${{ inputs.dependencies_to_update }}'
          broken=''
          if [ -z "$want" ]; then
            # 两个坑都在 11 月的每日构建里真炸过，这里必须都防住：
            #  1) Actions 的 bash 自带 -e -o pipefail，而 haxelib path 对未安装的库
            #     返回非零 —— 旧写法里命令替换的管道一挂，整个脚本当场死掉，
            #     broken 兜底根本没机会跑，「残缺缓存→回退重装」永远走不到。
            #     所以每条 haxelib path 都挂 || true，缺库只记 broken，不炸步骤。
            #  2) 库清单从 setup 脚本现抓，不手写：setup 加了新库（10-28 移动版接
            #     extension-document-picker）而手写清单不跟，判定就会放过残缺缓存，
            #     缺库被拖到编译期才炸。三份脚本抓并集，哪个仓库用哪个 OS 都覆盖。
            libs=$(grep -hoE 'haxelib (install|git|set) [A-Za-z0-9_.-]+' \
                    setup/unix.sh setup/windows.bat setup/windows-msvc.bat 2>/dev/null \
                    | awk '{print $3}' | sort -u || true)
            if [ -z "$libs" ]; then
              # setup 脚本没匹配到（布局变了）就退回这份老清单，判定别裸奔
              libs='lime hxcpp openfl flixel flixel-addons flxanimate luahscript linc_luajit hxvlc hscript-iris moonchart tjson hxdiscord_rpc'
            fi
            for lib in $libs; do
              # .current 不在 = 这库压根没装，直接判残缺。
              # 注意 haxelib 仓库目录名把点号换成逗号：funkin.vis 落在 .haxelib/funkin,vis/
              # （本地与 CI 都可验证）。字面用点号找路径必然误判残缺。
              libdir=".haxelib/$(printf '%s' "$lib" | tr '.' ',')"
              if [ ! -f "$libdir/.current" ]; then
                broken="$broken $lib"
                echo "[sentinel] $lib：$libdir/.current 不存在"
                continue
              fi
              # 取「长得像路径的行」而不是 head -1：haxelib 会不定期往 stdout 混
              # 版本横幅（A new version...）和空行，head -1 抓到它们就会把健康库
              # 误判成残缺（11-04 的 Linux job 随机误判 hscript-iris/hxvlc/lime/
              # openfl 四个库，全是这条的嫌疑）。
              raw=$(haxelib path "$lib" 2>&1 || true)
              p=$(printf '%s\n' "$raw" | grep -m1 -E '^([A-Za-z]:[/\\]|/)' | tr -d '\r' | tr '\\' '/' || true)
              # 空目录也算残缺：luahscript 那种「clone 中断只剩个空壳 checkout」的库，
              # haxelib path 会正常报 classpath、目录也在，编译期才炸 Type not found。
              if [ -z "$p" ] || [ ! -d "$p" ] || [ -z "$(ls -A "$p" 2>/dev/null)" ]; then
                broken="$broken $lib"
                echo "[sentinel] $lib 判残缺 —— haxelib path 输出前3行: $(printf '%s\n' "$raw" | head -3 | tr '\n' '|')"
              fi
            done
          fi

          if [ -n "$want" ]; then
            mode=install
            echo "dependencies_to_update=$want → 重新校验 / 安装全部依赖"
          elif [ -z "$broken" ]; then
            mode=cached
            echo "缓存里的依赖 classpath 全部命中 → 跳过依赖安装，直接用 .haxelib/"
          else
            mode=install
            echo "缓存里的库残缺:$broken → 回退完整安装"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # 回退安装前把恢复来的 .haxelib/ 整个清掉。缓存被判残缺，里面就有半装/空壳的库
      # ——而 haxelib git 见到同名目录存在就不再 clone（空壳 checkout 正好卡在这里：
      # 「You already have luahscript version git installed」然后什么都不干），残缺
      # 目录会原样活过 install，这正是坏缓存能一代代传下来的通道。install 模式下
      # .haxelib 反正不可信，删掉重装才是真·回退。dependencies_to_update=all 时
      # restore 本来就跳过，这里删的只是个空目录，无伤。
      - name: Wipe .haxelib before reinstall (cache was judged broken)
        if: steps.haxelib.outputs.mode == 'install'
        shell: bash
        run: |
          rm -rf .haxelib
          mkdir -p .haxelib

      # 装依赖这一步给个 id：装挂了就不能再存缓存 —— 否则一份"半装"的 .haxelib/
      # 会被 if: always() 的 save 收进去，之后每轮 restore 都命中它（luahscript 空壳
      # 就是这么被固化的）。
      - name: Install Libraries
        id: install
        if: steps.haxelib.outputs.mode == 'install'
        run: ${{ inputs.setupCommand }}

      - name: Use cached Libraries
        if: steps.haxelib.outputs.mode == 'cached'
        shell: bash
        run: |
          echo "dependencies_to_update 留空 → 跳过 Install Libraries，直接用缓存里的 .haxelib/"
          echo "已缓存条目（前 20 个）："
          ls -A .haxelib | head -20

      # extension-document-picker 的 git fork 只带源码（project/），没有预编译的
      # ndll/iPhone/*.a —— lime 编 iOS 时会去 .haxelib/<ext>/ndll/iPhone/ 找
      # lib<name>.iphoneos*.a（候选：.iphoneos / -v7 / -v7s / -64），一个都没有就
      # 直接炸（11-04 起移动版每日构建的根因之一）。fork 不往里塞二进制（每次改
      # 源码都得重编重推），就在 CI 现场编一份：-DHXCPP_ARM64 对应 hxcpp
      # finish-setup.xml 的 LIBEXTRA=.iphoneos-64，正好落在 lime 的候选清单里。
      # 产物写进 .haxelib/ 的 git checkout，随上面的缓存整体存取，下轮命中即跳过。
      - name: Build iOS ndll from source (extension-document-picker)
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          # git 安装的 checkout 固定在 .haxelib/<lib>/git/（这库名只有短横线没点号，
          # 不涉及逗号转换）。不问 haxelib path：它会随机往 stdout 混版本横幅，
          # head -1 抓到横幅就把 root 判空、整步误走"未安装"分支（wave-7 iOS 实录：
          # 步骤打印"未安装，跳过"，五秒后 lime 找不到 ndll 炸掉）。release 安装的
          # 版本自带 ndll、没有 git/ 目录，跳过正合适。
          root=".haxelib/extension-document-picker/git"
          if [ ! -d "$root/project" ]; then
            echo "extension-document-picker git checkout 不在 $root（release 自带 ndll 或未引用），跳过"
            exit 0
          fi
          if ls "$root"/ndll/iPhone/libextension_document_picker.iphoneos*.a >/dev/null 2>&1; then
            echo "ndll 已存在（缓存带来），跳过源码编译："
            ls "$root"/ndll/iPhone/libextension_document_picker.iphoneos*.a
            exit 0
          fi
          # -Dios 不能省：BuildTool 只把 iphoneos 落成 iphone/iphoneos/apple 这组
          # define，而 Build.xml 的 NDLL target 写的是 if="ios"（它是为 lime rebuild
          # 准备的，lime 才设 ios）。少了它 target 解析为空，hxcpp 静默 exit 0，
          # 产物目录压根不建（2026-11-05 CI 实录）。
          # 还得先 cd 进 project/：Build.xml 里的 common/、ios/、../ndll/ 全是相对
          # 路径，而 haxelib run hxcpp 的 cwd 在 hxcpp 仓库里，不 cd 就是
          # "no such file or directory: './common/ExternalInterface.cpp'"。fork 自带
          # 的 build.sh 也是这么干的（cd 到 project 再调）。
          cd "$root/project"
          haxelib run hxcpp Build.xml -Diphoneos -Dios -DHXCPP_ARM64 -DOBJC_ARC
          ls -la "$root"/ndll/iPhone/

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      # -always 是给缓存用的：让 hxcpp 每轮都去查内容 hash，而不是先按 mtime 判断
      # "这个 .obj 是不是新的"。已编过的文件由 hash 命中、直接跳过，压根不调编译器。
      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }} -always

      # 编译失败也存：hxcpp 是并行编的，报错时大部分 .obj 已经编完了，
      # 那些产物下次照样命中。失败的那个文件不会留在缓存里
      # （Compiler.compile() 在编译器返回非 0 时会把自己产出的 obj 删掉）。
      #
      # 但依赖安装失败的那一轮不存：那时 .haxelib/ 是残缺的，存进去等于把坏状态
      # 固化成下一轮的起点（有 restore-keys 前缀匹配，坏缓存会被一直命中）。
      #
      # save 的 key 必须和上面 restore 的 key **同形**，只差末尾的 run_id。
      # restore 命中靠的是 restore-keys 前缀匹配：save 这边少一段（比如漏掉 target），
      # 写进去的那份就永远匹配不上自己的 restore —— 缓存存了，但没人读得到。
      - name: Save build cache (deps + hxcpp objects)
        # haxelib 判定步骤自己挂了也不能存：那时既没验证过缓存、也大概率没装上依赖，
        # 存进去就是空 .haxelib/ —— restore-keys 是"最新者优先"，下轮就会命中这份
        # 空壳、把真缓存全部压住，然后空转层层放大（11 月每日构建就是这么坏的）。
        if: always() && steps.haxelib.outcome == 'success' && steps.install.outcome != 'failure'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_target.outputs.slug }}-${{ github.run_id }}
          path: |
            .haxelib/
            .hxcpp_cache

      # 翻新库（dependencies_to_update 非空）刚存出一份全新缓存，同一条 target
      # 滚动线上被取代的旧缓存在这里一并删掉 —— 它们是旧 hxcpp / 旧依赖编的，
      # 不会再被命中，留着只会吃 10 GB 配额（日常的零散清理仍走 hxcpp-cache.yml）。
      # 只在构建成功时清：失败的轮子旧缓存还在，下一轮翻新再收。
      - name: Prune superseded caches (refresh builds)
        if: inputs.dependencies_to_update != '' && success()
        uses: actions/github-script@v9
        env:
          SLUG: ${{ steps.cache_target.outputs.slug }}
        with:
          script: |
            const prefix = `${process.env.CACHE_PREFIX}-${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}-${process.env.SLUG}-`;
            const runId = context.runId;

            const { data } = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: prefix,
              per_page: 100,
            });

            let deleted = 0;
            let freed = 0;
            for (const c of data.actions_caches) {
              if (c.key.endsWith(`-${runId}`)) continue;
              core.info(`删除 ${c.key}  ${(c.size_in_bytes / 1048576).toFixed(1)} MB`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: c.id,
              });
              deleted++;
              freed += c.size_in_bytes;
            }
            core.info(`清理完成：删除 ${deleted} 份，释放 ${(freed / 1048576).toFixed(1)} MB（本次刚存的 ${runId} 保留）`);

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
