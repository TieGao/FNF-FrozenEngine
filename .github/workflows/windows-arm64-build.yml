name: Windows ARM64 Build

# Windows on ARM64 原生构建（独立于 desktop-build.yml 的实验线）。
#
# lime 单仓库双分支（IceTheAxe/lime）：develop = 开发形态（上游源码 + arm64
# 补丁 + openal 子模块改指 TieGao/openal-soft）；CI 把带全平台 ndll（含
# WindowsArm64）的 haxelib 包推到同仓库 `haxelib` 分支 = 库形态。
# setup/windows.bat 与 setup/unix.sh 统一钉 `haxelib` 分支：
#   haxelib git lime https://github.com/IceTheAxe/lime haxelib --always
# 本工作流不重建 ndll，直接消费 `haxelib` 分支。
#
# 其余依赖全走 setup/windows.bat 的 pinned 清单（hxcpp 用 TieGao git fork，
# 自带 WindowsArm64 工具链；hxvlc / linc_luajit 已带 arm64 二进制支持）。
# windows-latest 的 VS2022 自带 MSVC ARM64 生成工具，无需额外安装。

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: FrozenEngine

jobs:
  build:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          call setup\windows.bat

      - name: Skip SScript setup mode
        shell: cmd
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa

      - name: Compile
        shell: pwsh
        run: echo y & haxelib run lime build windows -arm64 -D officialBuild -always

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsBuild-arm64
          path: export/release/windows/bin
